description: 'Inherent (Inherent Laboratories Ltd) is an early-stage AI research lab
  building recursively self-improving AI systems for scientific discovery — "AI scientists"
  intended to augment human researchers rather than replace them. Incorporated as a
  Public Benefit Corporation and backed by Index Ventures, the company frames itself
  as a reimagined research institution pursuing general-purpose inventive AI, autonomous-lab
  capabilities, and human-machine teaming across scientific domains. As of this profile
  it publishes a manifesto and careers page but no public API, SDK, developer documentation,
  or product surface — this repo tracks it as a lead for enrichment as those surfaces emerge.'
